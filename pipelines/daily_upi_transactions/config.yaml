dataset:
  id: daily_upi_transactions
  name: NPCI Daily UPI Transactions

schedule:
  frequency: daily

source:
  type: webpage
  url: https://www.npci.org.in/product/upi/product-statistics

fetch:
  preferred_method: crawl4ai
  fallback_method: http
  timeout_seconds: 120

artifact:
  directory: raw/daily_upi_transactions
  filename: npci_upi_product_statistics.html

target:
  format: csv

  columns:
    - Day
    - Volume (In Mn.)
    - Value (In Cr.)

validation:
  minimum_rows: 1
  minimum_fill_rate: 0.90

storage:
  table: daily_upi_transactions
