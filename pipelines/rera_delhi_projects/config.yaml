# RERA Delhi Projects Pipeline Configuration
dataset:
  name: rera_delhi_projects
  canonical_columns:
    - Registration_Number
    - Project_Name
    - Promoter_Name
    - District
    - Registration_Date
    - Status
    - Category
    - Address
    - Download_Date

source:
  base_url: https://erera.co.in/reradelhiindex/PublicView/RegisteredProjectDetail
  excel_export_url: https://erera.co.in/reradelhiindex/PublicView/ExportExcel
  # The Excel download endpoint might be different, will be discovered

paths:
  raw_dir: pipelines/rera_delhi_projects/raw
  output_dir: pipelines/rera_delhi_projects/output
  metadata_dir: pipelines/rera_delhi_projects/metadata

download:
  max_retries: 3
  timeout: 60
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

validation:
  min_rows: 1
  required_columns:
    - Registration_Number
    - Project_Name
