dataset:
  id: ipo_creation
  name: IPO Creation

schedule:
  frequency: monthly

source:
  type: "1b"
  name: NPCI official website
  organization: NPCI
  url: https://www.npci.org.in/product/upi/product-statistics

description: >
  Bank-wise UPI IPO (Initial Public Offering) mandate
  creation volumes with approval, business decline,
  and technical decline rates.

fetch:
  method: crawl4ai
  timeout_seconds: 120

artifact:
  directory: raw/ipo_creation
  filename: npci_ipo_creation.html

target:
  format: csv

  columns:
    - Remitter Bank
    - Total Volume
    - Approved%
    - BD%
    - TD%

  types:
    Remitter Bank: string
    Total Volume: int
    Approved%: float
    BD%: float
    TD%: float

validation:
  minimum_rows: 1
  unique_key:
    - Remitter Bank

provenance: PROVEN
